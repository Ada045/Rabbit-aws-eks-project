apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbit-nginx
  namespace: rabbit-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rabbit-nginx
  template:
    metadata:
      labels:
        app: rabbit-nginx
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf

      volumes:
        - name: nginx-config
          configMap:
            name: rabbit-nginx-config
---
apiVersion: v1
kind: Service
metadata:
  name: rabbit-nginx
  namespace: rabbit-app
spec:
  type: LoadBalancer
  selector:
    app: rabbit-nginx
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP