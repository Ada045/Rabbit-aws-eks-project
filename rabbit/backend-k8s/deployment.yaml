apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbit-backend
  namespace: rabbit-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rabbit-backend
  template:
    metadata:
      labels:
        app: rabbit-backend
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: rabbit-backend
              topologyKey: kubernetes.io/hostname
      containers:
        - name: backend
          image: 926337676555.dkr.ecr.eu-west-3.amazonaws.com/rabbit-backend:1.1
          imagePullPolicy: Always

          ports:
            - containerPort: 3000
          
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
          
          env:
            - name: PORT
              value: "3000"
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: rabbit-secret
                  key: MONGO_URI
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: rabbit-secret
                  key: SECRET_KEY
            - name: STRIPE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: rabbit-secret
                  key: STRIPE_SECRET_KEY
            - name: WEBHOOK_ENDPOINT_SECRET
              valueFrom:
                secretKeyRef:
                  name: rabbit-secret
                  key: WEBHOOK_ENDPOINT_SECRET
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: rabbit-secret
                  key: API_KEY
            - name: API_SECRET
              valueFrom:
                secretKeyRef:
                  name: rabbit-secret
                  key: API_SECRET
            - name: CLOUD_NAME
              valueFrom:
                secretKeyRef:
                  name: rabbit-secret
                  key: CLOUD_NAME
            - name: FRONTEND_URL
              valueFrom:
                configMapKeyRef:
                  name: rabbit-configmap
                  key: frontend-url
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app: rabbit-backend
---
apiVersion: v1
kind: Service
metadata:
  name: rabbit-backend
  namespace: rabbit-app
spec:
  selector:
    app: rabbit-backend

  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
  type: ClusterIP   
